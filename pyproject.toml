[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcc-pipeline"
version = "0.1.0"
description = "Experimentos de correção iterativa com SonarQube e LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "pyyaml>=6,<7", "typer>=0.16,<1", "rich>=14,<15", "matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
tcc-pipeline = "tcc_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

name: Pipeline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.17
      - run: python -m uv sync --locked
      - run: python -m uv run ruff check .
      - run: python -m uv run ruff format --check .
      - run: python -m uv run pytest -q
      - run: python -m uv run mimir-pipeline demo --output artifacts/ci-demo
